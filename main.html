<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- iOSでの拡大・縮小や表示崩れを防ぐviewport設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Feelings</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-text-size-adjust: 100%;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    position: fixed;
    touch-action: none;
    background-color: #000;
}

body{
    width:100vw;
    height:100dvh;
    background: radial-gradient(circle at center, #220000 0%, #111111 50%, #000000 90%);
    color:white;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

/* 画面ノイズ */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.03) 0px,
        transparent 3px
    );
    animation:noise .15s infinite;
    pointer-events:none;
    z-index: 2;
}

@keyframes noise{
    0%{ transform:translate(0); }
    50%{ transform:translate(-3px,2px); }
    100%{ transform:translate(2px,-3px); }
}

/* 霧 */
.fog{
    position:absolute;
    width:200%;
    height:200%;
    background: radial-gradient(
        circle,
        rgba(100,100,100,.12),
        transparent 60%
    );
    animation:fog 30s linear infinite;
    z-index: 1;
    pointer-events: none;
}

@keyframes fog{
    from{ transform:translate(-20%,-20%); }
    to{ transform:translate(20%,20%); }
}

/* 表示文字 */
.text{
    position:absolute;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    width: max-content;
    max-width: 90vw;
    text-align:center;
    font-size:clamp(16px, 4.5vw, 45px);
    line-height:1.5;
    font-weight:bold;
    text-shadow: 0 0 10px red, 0 0 40px black;
    animation: appear .8s forwards, shake .15s infinite;
    opacity: 1;
    transition: opacity 1.2s ease, filter 1.2s ease;
    z-index: 3;
    -webkit-font-smoothing: antialiased;
}

/* 消滅時のフェードアウト */
.text.fade-out {
    opacity: 0;
    filter: blur(10px);
}

@keyframes appear{
    0%{
        opacity:0;
        filter:blur(20px);
        transform: translate(-50%,-50%) scale(1.4);
    }
    100%{
        opacity:1;
        filter:blur(0);
        transform: translate(-50%,-50%) scale(1);
    }
}

@keyframes shake{
    0%{ margin-left:0; }
    50%{ margin-left:3px; }
    100%{ margin-left:-3px; }
}

/* 画面の暗い部分 */
.vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 180px rgba(0,0,0,0.95);
    z-index: 4;
}
</style>
</head>

<body>

<div class="fog"></div>
<div class="vignette"></div>

<script>
// ★ URL表示の偽装
if (window.history && window.history.replaceState) {
    window.history.replaceState(null, "", "/"); 
}

const words=[
    // --- 一番最初の元メッセージ ---
    "人は愚かだ",
    "人は争う",
    "人は裏切る",
    "人は嘘をつく",
    "人は奪う",
    "人は支配する",
    "人は嫉妬する",
    "人は憎む",
    "人は傷つける",
    "人は忘れる",
    "人は自分を守るために他者を傷つける",
    "人は過ちを繰り返す",
    "欲望は終わらない",
    "笑顔の裏に隠された闇",
    "優しさは時に偽りになる",
    "正義は人によって変わる",
    "善人も悪人になる",
    "愛は時に狂気になる",
    "死から逃げられない",
    "終わりは必ず来る",
    "最後の瞬間",
    "消える意識",
    "失われる記憶",
    "存在が消えていく恐怖",
    "永遠の静寂",
    "死後に何があるのか",
    "暗闇の先には何がある",
    "目を閉じた後の世界",
    "誰にも届かない最後の声",
    "忘れ去られる名前",
    "死は恐怖か",
    "死は救いか",
    "生きる意味とは何か",
    "存在する理由とは何か",
    "最後に残るものは何か",
    "それでも人は愛する",
    "それでも人は生きる",
    "失うから大切にする",
    "終わりがあるから輝く",

    // --- 追加のメッセージ（人） ---
    "人は愚かだ",
    "人は争う",
    "人は面白い",
    "人は裏切る",
    "人は自分勝手だ",
    "人は愛する",
    "人は欲深い",
    "人は学ぶ",
    "人は脆い",
    "人は変わる",

    // --- 追加のメッセージ（犬） ---
    "犬は忠実だ",
    "犬は従順だ",
    "犬は賢い",
    "犬は遊ぶ",
    "犬は愛情深い",
    "犬は寂しがりだ",
    "犬は勇敢だ",
    "犬は騒がしい",
    "犬は人懐っこい",
    "犬は自由だ",

    // --- 追加のメッセージ（猫） ---
    "猫は気まぐれだ",
    "猫は自由だ",
    "猫は気高い",
    "猫は狡猾だ",
    "猫は臆病だ",
    "猫は好奇心旺盛だ",
    "猫は甘える",
    "猫は距離を置く",
    "猫は美しい",
    "猫は謎めいている"
];

function addText(){
    const div = document.createElement("div");
    div.className = "text";
    div.textContent = words[Math.floor(Math.random() * words.length)];

    div.style.left = (Math.random() * 40 + 30) + "vw";
    div.style.top = (Math.random() * 40 + 30) + "dvh";

    const colorRand = Math.random();
    if (colorRand > 0.6) {
        div.style.color = "#ff2222";
    } else if (colorRand > 0.1) {
        div.style.color = "#ffffff";
    } else {
        div.style.color = "#880000";
    }

    document.body.appendChild(div);

    const texts = document.querySelectorAll(".text:not(.fade-out)");
    if(texts.length > 20){
        const oldText = texts[0];
        oldText.classList.add("fade-out");
        setTimeout(() => {
            oldText.remove();
        }, 1200);
    }
}

function loop(){
    addText();
    setTimeout(loop, Math.random() * 200 + 800);
}

loop();
</script>

</body>
</html>

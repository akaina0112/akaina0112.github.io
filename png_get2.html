<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Sprite Tool</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f7fb;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  display: flex;
  gap: 30px;
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

/* 左：操作エリア */
.left {
  text-align: center;
}

/* 右：プレビュー */
.right {
  text-align: center;
}

/* 画像 */
.preview-wrap {
  position: relative;
  display: inline-block;
}

#previewImg {
  image-rendering: pixelated;
  width: 256px; /* ←ここで左の表示サイズ変更 */
}

/* ボタンレイヤー */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
}

.cell-btn {
  position: absolute;
  border: none;
  background: transparent;
  cursor: pointer;
}

.cell-btn:hover {
  background: rgba(0,150,255,0.2);
  outline: 1px solid #4c8df6;
}

/* 右の大プレビュー */
#bigPreview {
  width: 160px; /* ←ここで大きさ変更 */
  height: 160px; /* ←ここで大きさ変更 */
  background-image: url(https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/EntityCSS.png);
  background-repeat: no-repeat;
  image-rendering: pixelated;
  border: 2px solid #ddd;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* 座標 */
.tooltip {
  position: fixed;
  background: rgba(0,0,0,0.8);
  color: white;
  font-size: 12px;
  padding: 4px 6px;
  border-radius: 6px;
  pointer-events: none;
}

canvas {
  margin-top: 10px;
  border: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

  <!-- 左 -->
  <div class="left">
    <h3>クリック選択</h3>

    <div class="preview-wrap">
      <img id="previewImg"
        src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/EntityCSS.png">
      <div id="overlay" class="overlay"></div>
    </div>
  </div>

  <!-- 右 -->
  <div class="right">
    <h3>プレビュー</h3>
    <div id="bigPreview"></div>
    <div id="tooltip" class="tooltip" style="display:none;"></div>
    <canvas id="canvas" width="100%" height="100%"></canvas>
    <br>
    <a id="download">ダウンロード</a>
  </div>

</div>

<script>
const size = 16; // ←アイコンサイズ（基本16）

const img = document.getElementById("previewImg");
const overlay = document.getElementById("overlay");
const tooltip = document.getElementById("tooltip");
const bigPreview = document.getElementById("bigPreview");

// 切り抜き
function cut(x, y) {
  const image = new Image();
  image.crossOrigin = "anonymous";
  image.src = img.src;

  image.onload = () => {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(image, x, y, size, size, 0, 0, size, size);

    const link = document.getElementById("download");
    link.href = canvas.toDataURL("image/png");
    link.download = `icon_${x}_${y}.png`;
    link.textContent = `PNGダウンロード (${x},${y})`;
  };

  // 右プレビュー更新
  bigPreview.style.backgroundPosition = `-${x}px -${y}px`;
}

// ボタン生成
img.onload = () => {
  const scaleX = img.width / img.naturalWidth;
  const scaleY = img.height / img.naturalHeight;

  const cols = Math.floor(img.naturalWidth / size);
  const rows = Math.floor(img.naturalHeight / size);

  overlay.style.width = img.width + "px";
  overlay.style.height = img.height + "px";

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const btn = document.createElement("button");
      btn.className = "cell-btn";

      const px = x * size;
      const py = y * size;

      btn.style.left = (px * scaleX) + "px";
      btn.style.top = (py * scaleY) + "px";
      btn.style.width = (size * scaleX) + "px";
      btn.style.height = (size * scaleY) + "px";

      // ホバー
      btn.addEventListener("mousemove", (e) => {
        tooltip.style.display = "block";
        tooltip.textContent = `${px}, ${py}`;
        tooltip.style.left = e.clientX + 10 + "px";
        tooltip.style.top = e.clientY + 10 + "px";

        bigPreview.style.backgroundPosition = `-${px}px -${py}px`;
      });

      btn.addEventListener("mouseleave", () => {
        tooltip.style.display = "none";
      });

      // スマホ
      btn.addEventListener("touchstart", (e) => {
        const touch = e.touches[0];
        tooltip.style.display = "block";
        tooltip.textContent = `${px}, ${py}`;
        tooltip.style.left = touch.clientX + 10 + "px";
        tooltip.style.top = touch.clientY + 10 + "px";

        bigPreview.style.backgroundPosition = `-${px}px -${py}px`;
      });

      btn.onclick = () => cut(px, py);

      overlay.appendChild(btn);
    }
  }
};
</script>

</body>
</html>
